<style>

.mut{color:var(--mut)}

.load{display:flex;justify-content:center;align-items:center;padding:50px;color:var(--mut)}

#splash .sp-bar{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:26px;overflow:hidden}#splash .sp-bar i{display:block;width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffe082,#d4af37);animation:spjalan 1.2s ease-in-out infinite}

@keyframes spjalan{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}@keyframes spmasuk{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
#offbar{position:fixed;left:0;right:0;top:0;z-index:9000;background:#7a1f1f;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;font-size:13px;text-align:center}#offbar button,#updbar button{margin-left:8px;border:0;border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer;background:#fff;color:#14532d}

#bel{position:relative;background:transparent;border:1px solid var(--line);border-radius:10px;font-size:18px;line-height:1;padding:7px 10px;cursor:pointer}#bel .nb{position:absolute;margin:0;top:-6px;right:-6px;transform:none}
#top{padding-top:calc(14px + env(safe-area-inset-top))}.auth{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.lnk{background:none;border:0;color:var(--g2);font-weight:600;cursor:pointer;font-size:13px;padding:8px}
@media(pointer:coarse){.btn,.nav a,.tabs button,.seg button{min-height:44px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const fmtUkuran = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
async function siapkanBerkas(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (/^image\x2f/.test(f.type) || ['jpg', 'jpeg', 'png', 'webp', 'gif'].indexOf(ext) >= 0) {
    let bmp;
    try { bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); }
    catch (e) { try { bmp = await createImageBitmap(f); } catch (e2) { throw new Error('Format foto "' + f.name + '" tidak didukung. Gunakan JPG atau PNG.'); } }
    const sk = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * sk)); c.height = Math.max(1, Math.round(bmp.height * sk));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.82);
    const data = url.split(',')[1];
    return { ext: 'jpg', data: data, ukuran: Math.floor(data.length * 0.75), thumb: url, label: f.name };
  }
  if (['pdf', 'docx', 'xlsx', 'txt'].indexOf(ext) < 0) throw new Error('Jenis file "' + f.name + '" tidak didukung (boleh: foto, PDF, DOCX, XLSX, TXT).');
  if (f.size > 4 * 1024 * 1024) throw new Error('"' + f.name + '" lebih dari 4 MB.');
  const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => no(new Error('Gagal membaca file.')); r.readAsDataURL(f); });
  return { ext: ext, data: data, ukuran: f.size, thumb: '', label: f.name };
}

  $('#re2').onclick = () => { simpanToken(''); ST.token = null; layarLogin('staf'); };
}

const IZ = { kon: null, tab: 'dash', timer: null, cache: {} };
const IZ_SETUJU_CLS = { 'Menunggu Persetujuan': 'wr', 'Disetujui': 'ok', 'Ditolak': 't3', 'Dibatalkan': '' };
const IZ_OPER_CLS = { 'Sedang Izin': 'in', 'Selesai': 'ok', 'Terlambat Kembali': 't5', 'Belum Dimulai': '' };
const bdIzin = x => {
  let h = `<span class="bd ${IZ_SETUJU_CLS[x.setuju] || ''}">${esc(x.setuju)}</span>`;
  if (x.setuju === 'Disetujui' && x.oper && x.oper !== '-') h += ` <span class="bd ${IZ_OPER_CLS[x.oper] || ''}">${esc(x.oper)}${x.telat ? ' ' + x.menitTelat + ' mnt' : ''}</span>`;
  if (x.pulangAwal) h += ' <span class="bd in">' + (x.jenisIzin === 'Izin Datang Terlambat' ? 'Datang terlambat' : 'Pulang') + '</span>';
  if (x.mendesak && x.setuju === 'Menunggu Persetujuan') h += ' <span class="bd t3">Mendesak</span>';
  if (x.dikoreksi) h += ' <span class="bd">Dikoreksi</span>';
  return h;
};
const izWaktu = x => `${esc(x.tanggal)} \u00B7 ${esc(x.mulai)}${x.selesai ? '\u2013' + esc(x.selesai) : ''}`;
const izOrang = x => `<b>${esc(x.nama)}</b><div class="mut">${x.jenis === 'guru' ? 'Guru' + (x.nip ? ' \u00B7 NIY ' + esc(x.nip) : '') : esc(x.kelas) + ' \u00B7 ' + esc(x.jenisIzin)}</div>`;
const izSimpan = a => { a.forEach(x => { IZ.cache[x.id] = x; }); return a; };
const izHentikan = () => { if (IZ.timer) { clearInterval(IZ.timer); IZ.timer = null; } };

async function izBadge() {
  try {
    const b = await call('izinBadge');
    perbaruiNotif({ perlu: b.perlu, telat: b.telat });
    const a = $('#nav a[data-m="izin"]'); if (!a) return;
    const o = $('.nb', a); if (o) o.remove();
    const n = b.perlu + b.telat;
    if (n > 0) a.insertAdjacentHTML('beforeend', `<b class="nb" title="${b.perlu} menunggu keputusan, ${b.telat} terlambat kembali">${n}</b>`);
  } catch (e) {  }
}

async function halIzin(ct, hidup) {
  izHentikan();
  IZ.kon = await call('izinKonteks');
  if (!hidup()) return;
  const b = IZ.kon.bisa, tabs = [['dash', 'Dashboard']];
  if (b.ajukanGuru || b.ajukanSiswa || b.siswaMandiriDimatikan) tabs.push(['form', 'Ajukan Izin']);
  tabs.push(['saya', 'Izin Saya']);
  if (b.laporKembali) tabs.push(['kembali', 'Laporan Kembali']);
  if (b.putuskanGuru || b.putuskanSiswa) tabs.push(['setuju', 'Persetujuan']);
  if (b.lihatGuruSemua || b.lihatSiswaSemua) tabs.push(['pantau', 'Pemantauan & Rekap']);
  if (b.pengaturan) tabs.push(['set', 'Pengaturan']);
  if (!tabs.some(t => t[0] === IZ.tab)) IZ.tab = 'dash';
  ct.innerHTML = `<div class="seg" id="izt" style="margin-bottom:16px;max-width:100%;overflow-x:auto">${tabs.map(t => `<button data-t="${t[0]}" class="${t[0] === IZ.tab ? 'on' : ''}">${t[1]}</button>`).join('')}</div><div id="izb"></div>`;
  const tampil = async () => {
    izHentikan();
    $$('#izt button').forEach(x => x.classList.toggle('on', x.dataset.t === IZ.tab));
    const el = $('#izb'); if (!el) return;
    const h = () => hidup() && $('#izb') === el && IZ.tab === (tabs.find(t => t[0] === IZ.tab) || [])[0];
    try {
      if (IZ.tab === 'dash') await izDash(el, h);
      else if (IZ.tab === 'form') izForm(el);
      else if (IZ.tab === 'saya') izTabel(el, h, { tampilan: 'saya', judul: 'Riwayat Izin Saya' });
      else if (IZ.tab === 'kembali') await izTabKembali(el, h);
      else if (IZ.tab === 'setuju') izTabel(el, h, { tampilan: 'persetujuan', judul: 'Menunggu Keputusan Anda' });
      else if (IZ.tab === 'pantau') izTabel(el, h, { tampilan: 'semua', judul: 'Pemantauan & Rekapitulasi', pantau: true });
      else if (IZ.tab === 'set') izPengaturan(el);
    } catch (e) { if (h()) el.innerHTML = `<div class="card"><div class="note">${esc(e.message)}</div></div>`; }
  };
  $$('#izt button').forEach(x => x.onclick = () => { IZ.tab = x.dataset.t; tampil(); });
  await tampil();
  izBadge();
}

async function izDash(el, hidup) {
  loading(el);
  const d = await call('izinDashboard');
  if (!hidup()) return;
  [d.guruLuar, d.siswaLuar, d.pulangAwal, d.terlambat, d.segera, d.perluTindakan, d.terbaru, d.mendesak].forEach(izSimpan);
  const st = (n, l, c) => `<div class="card stat ${c || ''}" style="margin:0"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const baris = (x, ekstra) => `<div class="izr" data-d="${esc(x.id)}" tabindex="0" role="button"><div>${izOrang(x)}</div><div class="izw">${izWaktu(x)}${ekstra ? `<div>${ekstra}</div>` : ''}</div></div>`;
  const daftar = (judul, a, kosong, ekstra) => `<div class="card" style="margin:0"><h3>${judul} <span class="bd">${a.length}</span></h3>${a.length ? a.slice(0, 8).map(x => baris(x, ekstra ? ekstra(x) : '')).join('') + (a.length > 8 ? `<div class="mut" style="margin-top:6px">dan ${a.length - 8} lainnya \u2014 lihat tab Pemantauan.</div>` : '') : `<div class="mut">${kosong}</div>`}</div>`;
  const peringatan = [];
  if (d.terlambat.length) peringatan.push(`<div class="note" style="background:#fdecea;border-color:#f5b5ae;color:#8a1c12">\u26A0\uFE0F <b>${d.terlambat.length}</b> pengguna melewati batas waktu kembali dan belum dikonfirmasi.</div>`);
  if (d.perluTindakan.length) peringatan.push(`<div class="note">\uD83D\uDD14 <b>${d.perluTindakan.length}</b> pengajuan menunggu keputusan Anda.</div>`);
  if (d.mendesak.length) peringatan.push(`<div class="note" style="background:#fdecea;border-color:#f5b5ae;color:#8a1c12">\u2757 <b>${d.mendesak.length}</b> pengajuan ditandai mendesak dan belum diputuskan.</div>`);
  if (d.segera.length) peringatan.push(`<div class="note">\u23F3 <b>${d.segera.length}</b> izin akan segera berakhir (\u2264 30 menit).</div>`);
  if (d.tanpaWali) peringatan.push(`<div class="note">\uD83E\uDDD1\u200D\uD83C\uDFEB <b>${d.tanpaWali}</b> pengajuan siswa dari kelas yang belum memiliki Wali Kelas. Atur kelas tanggung jawab di Data &amp; Pengaturan \u2192 Pengguna.</div>`);
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap"><div class="mut">Data diperbarui otomatis tiap 60 detik.</div><button class="btn o s" id="izr">\u21BB Perbarui</button></div>
    ${peringatan.join('')}
    <div class="grid g4" style="margin-bottom:16px">${st(d.totalHariIni, 'Pengajuan masuk hari ini')}${st(d.menunggu, 'Menunggu persetujuan', 'w')}${st(d.disetujui, 'Izin disetujui (hari ini)')}${st(d.ditolak, 'Izin ditolak (hari ini)', 'd')}</div>
    <div class="grid g4" style="margin-bottom:16px">${st(d.guruLuar.length, 'Guru di luar sekolah')}${st(d.siswaLuar.length, 'Siswa di luar sekolah')}${st(d.pulangAwal.length, 'Siswa pulang / datang terlambat')}${st(d.terlambat.length, 'Terlambat kembali', 'd')}</div>
    <div class="grid g2" style="margin-bottom:16px">${daftar('\uD83D\uDD34 Terlambat Kembali', d.terlambat, 'Tidak ada yang terlambat.', x => `Terlambat ${x.menitTelat} menit`)}${daftar('\uD83D\uDD14 Perlu Keputusan Anda', d.perluTindakan, 'Tidak ada pengajuan menunggu Anda.')}</div>
    <div class="grid g2" style="margin-bottom:16px">${daftar('Guru di Luar Sekolah', d.guruLuar, 'Tidak ada guru di luar sekolah.')}${daftar('Siswa di Luar Sekolah', d.siswaLuar, 'Tidak ada siswa di luar sekolah.')}</div>
    ${daftar('Riwayat Izin Terbaru', d.terbaru, 'Belum ada pengajuan.', x => bdIzin(x))}`;
  $('#izr', el).onclick = () => izDash(el, hidup).catch(e => toast(e.message, 'e'));
  $$('.izr', el).forEach(r => { const f = () => izDetail(IZ.cache[r.dataset.d], () => izDash(el, hidup)); r.onclick = f; r.onkeydown = e => { if (e.key === 'Enter') f(); }; });
  izHentikan();
  IZ.timer = setInterval(() => { if (!hidup()) return izHentikan(); if (!document.querySelector('.mbg')) izDash(el, hidup).catch(() => {}); }, 60000);
  izBadge();
}

function izKonfirmasi(judul, pesan, o, aksi) {
  const m = modal(`<h3>${esc(judul)}</h3><div class="note">${pesan}</div>
    <label>${esc(o.labelCatatan || 'Catatan')} ${o.wajib ? '<span style="color:var(--red)">(wajib)</span>' : '<span class="mut">(opsional)</span>'}</label><textarea id="izc" maxlength="500" placeholder="${esc(o.petunjuk || '')}"></textarea>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ${o.bahaya ? 'r' : ''}" id="izy">${esc(o.tombol)}</button><button class="btn o" id="izn">Batal</button></div>`, true);
  $('#izn', m).onclick = () => m.tutup();
  $('#izy', m).onclick = () => tombol($('#izy', m), async () => {
    const c = $('#izc', m).value.trim();
    if (o.wajib && c.length < 3) throw new Error('Catatan/alasan wajib diisi.');
    await aksi(c); m.tutup();
  }, 'Memproses...');
}

function izLaporKembali(x, setelah) {
  const m = modal(`<h3>\uD83D\uDCF7 Laporan Kembali Guru</h3><div class="note"><b>${esc(x.nama)}</b><br>${izWaktu(x)}<br>${esc(x.keperluan)}</div>
    <div class="row"><div><label>Nama</label><input value="${esc(x.nama)}" readonly></div><div><label>NIY <span style="color:var(--red)">(wajib)</span></label><input id="lkn" maxlength="30" value="${esc(x.nip || IZ.kon.niy || '')}"></div></div>
    <label>Jam kembali</label><input value="Otomatis (jam server saat laporan dikirim)" readonly>
    <div class="note" style="margin-top:8px">Ambil foto memakai aplikasi <b>TimeMark</b> (atau aplikasi kamera berstempel waktu yang diizinkan sekolah) sehingga tanggal &amp; jam tampil di foto. Jam kembali resmi memakai <b>jam server</b>. Foto adalah bukti dari pengguna dan belum diverifikasi keasliannya secara otomatis.</div>
    <label>Bukti foto TimeMark <span style="color:var(--red)">(wajib, JPG/PNG/WEBP)</span></label><input type="file" id="lkf" accept="image\x2fjpeg,image\x2fpng,image\x2fwebp" capture="environment"><div id="lkp" style="margin-top:8px"></div>
    <label>Catatan (opsional)</label><input id="lkc" maxlength="300">
    <div style="margin-top:12px"><button class="btn" id="lkv">Kirim Laporan Kembali</button></div>`);
  let foto = null;
  $('#lkf', m).onchange = async e => {
    const f = e.target.files[0]; foto = null; $('#lkp', m).innerHTML = '';
    if (!f) return;
    try {
      if (!/^image\x2f(jpeg|png|webp)$/.test(f.type) && !/\.(jpe?g|png|webp)$/i.test(f.name)) throw new Error('Bukti harus berupa foto JPG, PNG, atau WEBP.');
      foto = await siapkanBerkas(f);
      $('#lkp', m).innerHTML = `<img src="${foto.thumb}" alt="Pratinjau foto" style="max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line)">`;
    } catch (er) { toast(er.message || 'Foto tidak dapat dibaca.'); e.target.value = ''; }
  };
  $('#lkv', m).onclick = () => tombol($('#lkv', m), async () => {
    if (!$('#lkn', m).value.trim()) throw new Error('NIY wajib diisi.');
    if (!foto) throw new Error('Foto bukti (TimeMark) wajib diunggah.');
    const r = await call('izinLaporKembali', { id: x.id, nip: $('#lkn', m).value, catatan: $('#lkc', m).value, foto: [{ nama: 'kembali.' + foto.ext, data: foto.data }] }, 120);
    toast(r.telat ? `Laporan tersimpan (terlambat ${r.menitTelat} menit, ditandai untuk pemeriksaan).` : 'Laporan kembali tersimpan.');
    m.tutup(); (setelah || (() => {}))(); izBadge();
  }, 'Mengunggah...');
}
function izAksi(x, setelah) {
  const nama = esc(x.nama), w = izWaktu(x);
  const ringkas = `<b>${nama}</b><br>${w}<br>${esc(x.keperluan)}`;
  return {
    setuju: () => izKonfirmasi('Setujui pengajuan?', ringkas, { tombol: 'Ya, Setujui', labelCatatan: 'Catatan keputusan' }, async c => { const r = await call('izinKeputusan', { jenis: x.jenis, id: x.id, keputusan: 'Disetujui', catatan: c }); toast(r && r.final === false ? 'Persetujuan Anda tercatat. Menunggu ' + r.menunggu + '.' : 'Pengajuan disetujui.'); setelah(); }),
    tolak: () => izKonfirmasi('Tolak pengajuan?', ringkas, { tombol: 'Ya, Tolak', wajib: true, bahaya: true, labelCatatan: 'Alasan penolakan', petunjuk: 'Alasan akan terlihat oleh pemohon.' }, async c => { await call('izinKeputusan', { jenis: x.jenis, id: x.id, keputusan: 'Ditolak', catatan: c }); toast('Pengajuan ditolak.'); setelah(); }),
    batal: () => izKonfirmasi('Batalkan pengajuan?', ringkas + '<br><br>Pembatalan tidak dapat diurungkan.', { tombol: 'Ya, Batalkan', bahaya: true, labelCatatan: 'Alasan pembatalan' }, async c => { await call('izinBatal', { jenis: x.jenis, id: x.id, catatan: c }); toast('Pengajuan dibatalkan.'); setelah(); }),
    lapor: () => izLaporKembali(x, setelah),
    kembali: () => izKonfirmasi('Konfirmasi sudah kembali?', ringkas + `<br><br>Pastikan ${x.jenis === 'guru' ? 'guru' : 'siswa'} benar-benar sudah ${x.pulangAwal ? 'pulang' : 'kembali ke sekolah'}.`, { tombol: 'Ya, Sudah Kembali', labelCatatan: 'Catatan' }, async c => { const r = await call('izinKembali', { jenis: x.jenis, id: x.id, catatan: c }); toast(r.telat ? `Dikonfirmasi (terlambat ${r.menitTelat} menit).` : 'Kembali dikonfirmasi.'); setelah(); })
  };
}
const izTombol = x => {
  const b = x.bisa, o = [];
  if (b.laporKembali) o.push(`<button class="btn s" data-a="lapor">\uD83D\uDCF7 Laporan Kembali</button>`);
  if (b.putuskan) o.push(`<button class="btn s" data-a="setuju">Setujui</button><button class="btn s r" data-a="tolak">Tolak</button>`);
  if (b.kembali) o.push(`<button class="btn s o" data-a="kembali">${x.tanpaKembali ? (x.jenisIzin === 'Izin Datang Terlambat' ? 'Konfirmasi Hadir' : 'Konfirmasi Pulang') : 'Konfirmasi Kembali'}</button>`);
  if (b.batal) o.push(`<button class="btn s o" data-a="batal">Batalkan</button>`);
  return o.join(' ');
};

function izDetail(x, setelah) {
  if (!x) return;
  const kv = (k, v) => v ? `<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #f1f3f2"><div class="mut" style="width:150px;flex-shrink:0">${k}</div><div style="min-width:0;overflow-wrap:anywhere">${v}</div></div>` : '';
  const m = modal(`<h3>${x.jenis === 'guru' ? '\uD83D\uDC68\u200D\uD83C\uDFEB Izin Guru' : '\uD83C\uDF93 Izin Siswa'} <span class="mut" style="font-size:12px">${esc(x.id)}</span></h3><div style="margin-bottom:10px">${bdIzin(x)}</div>
    ${kv('Nama', esc(x.nama))}${x.jenis === 'guru' ? kv('NIY', esc(x.nip)) : kv('Kelas', esc(x.kelas)) + kv('NIS / NISN', esc([x.nis, x.nisn].filter(Boolean).join(' / '))) + kv('Jenis izin', esc(x.jenisIzin))}
    ${kv('Tanggal izin', esc(x.tanggal))}${kv(x.tanpaKembali ? (x.jenisIzin === 'Izin Datang Terlambat' ? 'Jam izin (tiba)' : 'Jam izin (pulang)') : 'Jam izin', esc(x.mulai))}${x.selesai ? kv(x.jenis === 'guru' ? 'Estimasi selesai' : 'Perkiraan kembali', esc(x.selesai)) : ''}
    ${kv(x.jenis === 'guru' ? 'Keperluan (Pribadi / Dinas)' : 'Keperluan', esc(x.keperluan))}${kv('Keterangan', esc(x.keterangan))}${kv('Diajukan', esc(x.diajukan))}${x.jenis === 'siswa' ? kv('Pemohon', esc(x.pemohon)) + kv('Wali Kelas', esc(x.waliEmail) || '<span style="color:var(--red)">Belum ada Wali Kelas untuk kelas ini</span>') : ''}
    ${x.jenis === 'siswa' && x.setuju === 'Menunggu Persetujuan' ? kv('Persetujuan Wali Kelas', esc(x.setujuWali) || 'belum') + kv('Persetujuan Guru Piket', esc(x.setujuPiket) || 'belum') : ''}${kv('Keputusan oleh', esc(x.penyetuju))}${kv('Waktu keputusan', esc(x.waktuKeputusan))}${kv('Catatan keputusan', esc(x.catatan))}${kv('Kembali aktual', esc(x.kembaliAktual))}
    ${x.setuju !== 'Disetujui' && x.setuju !== 'Dibatalkan' ? '<div class="note" style="margin-top:10px">Pengajuan ini <b>belum menjadi izin resmi</b>.</div>' : ''}
    <div id="izl" style="margin-top:10px"></div><div class="row" style="margin-top:12px;gap:6px">${izTombol(x)}${x.bisa.koreksi ? '<button class="btn s o" data-a="koreksi">Koreksi Data</button>' : ''}${x.bisa.audit ? '<button class="btn s o" data-a="audit">Riwayat Audit</button>' : ''}</div><div id="iza" style="margin-top:10px"></div>`);
  const aksi = izAksi(x, () => { m.tutup(); (setelah || (() => {}))(); izBadge(); });
  $$('[data-a]', m).forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (aksi[a]) return aksi[a]();
    if (a === 'audit') return tombol(b, async () => {
      const r = await call('izinAudit', { id: x.id });
      $('#iza', m).innerHTML = `<h3 style="font-size:14px">Riwayat Audit</h3><div class="tw"><table><tr><th>Waktu</th><th>Aktor</th><th>Aksi</th><th>Status</th><th>Catatan</th></tr>${r.map(a => `<tr><td>${esc(a.waktu)}</td><td>${esc(a.aktor)}<div class="mut">${esc(a.role)}</div></td><td>${esc(a.aksi)}</td><td>${esc(a.sebelum)} \u2192 ${esc(a.sesudah)}</td><td style="white-space:normal;min-width:180px">${esc(a.catatan)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Belum ada catatan</td></tr>'}</table></div>`;
    }, 'Memuat...');
    if (a === 'koreksi') izKoreksi(x, m, setelah);
  });
  if (x.jenis === 'guru' && x.buktiKembali && x.buktiKembali.length) {

    const l = $('#izk', m);
    $$('[data-k]', l).forEach(b => b.onclick = () => tombol(b, async () => {
      const r = await call('izinLampiran', { id: x.id, idx: +b.dataset.k, kind: 'kembali' }, 90);
      $('#izkv', l).innerHTML = `<img src="data:${r.tipe};base64,${r.data}" alt="Bukti kembali" style="max-width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--line)">`;

    $$('[data-l]', l).forEach(b => b.onclick = () => tombol(b, async () => {
      const r = await call('izinLampiran', { id: x.id, idx: +b.dataset.l }, 90), src = `data:${r.tipe};base64,${r.data}`;
      $('#izv', l).innerHTML = /^image\x2f/.test(r.tipe) ? `<img src="${src}" alt="Lampiran" style="max-width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--line)">` : `<a class="btn s" href="${src}" download="${esc(r.nama)}">\u2B07 Unduh ${esc(r.nama)}</a>`;
    }, 'Memuat...'));
  }
}
function izKoreksi(x, mdetail, setelah) {
  const guru = x.jenis === 'guru';
  const m = modal(`<h3>Koreksi Data ${esc(x.id)}</h3><div class="note">Koreksi dicatat di audit log dan <b>tidak mengubah keputusan persetujuan</b>. Pengajuan ditandai "Dikoreksi".</div>

    <div class="row"><div><label>Jam mulai</label><input type="time" id="km" value="${esc(x.mulai)}"></div><div><label>${guru ? 'Jam selesai' : 'Perkiraan kembali'}</label><input type="time" id="ks" value="${esc(x.selesai)}"></div></div>
    ${guru ? '' : `<label>Jenis izin</label><select id="kj">${IZ.kon.jenisSiswa.map(j => `<option ${j === x.jenisIzin ? 'selected' : ''}>${esc(j)}</option>`).join('')}</select>`}
    <label>Keperluan</label>${guru ? `<select id="kp">${['Pribadi', 'Dinas'].map(k => `<option ${k === x.keperluan ? 'selected' : ''}>${k}</option>`).join('')}</select>` : `<textarea id="kp">${esc(x.keperluan)}</textarea>`}<label>Keterangan</label><textarea id="kk">${esc(x.keterangan)}</textarea>
    <label>Alasan koreksi <span style="color:var(--red)">(wajib)</span></label><input id="ka" maxlength="300" placeholder="mis. salah ketik jam">
    <div style="margin-top:12px"><button class="btn" id="kv">Simpan Koreksi</button></div>`);
  $('#kv', m).onclick = () => tombol($('#kv', m), async () => {
    const d = { jenis: x.jenis, id: x.id, alasan: $('#ka', m).value, tanggal: $('#kt', m).value, mulai: $('#km', m).value, selesai: $('#ks', m).value, keperluan: $('#kp', m).value, keterangan: $('#kk', m).value };

      h.innerHTML = `<div class="mut" style="margin:6px 0">${r.total} pengajuan${r.jumlah > 1 ? ` \u00B7 halaman ${r.halaman} dari ${r.jumlah}` : ''}</div><div class="tw"><table><tr>${th('nama', 'Pemohon')}${th('tanggal', 'Tanggal & Jam')}<th>Keperluan</th>${th('setuju', 'Status')}<th>Pemberi keputusan</th><th>Aksi</th></tr>

        ${r.jumlah > 1 ? `<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px"><button class="btn s o" id="fpv" ${r.halaman <= 1 ? 'disabled' : ''}>\u2039 Sebelumnya</button><span class="mut">${r.halaman} / ${r.jumlah}</span><button class="btn s o" id="fnx" ${r.halaman >= r.jumlah ? 'disabled' : ''}>Berikutnya \u203A</button></div>` : ''}`;

      if ($('#fpv', h)) $('#fpv', h).onclick = () => { f.halaman = r.halaman - 1; muat(); };

      $$('[data-r]', h).forEach(td => {

  };

  $('#izrf', el).onclick = muat;
  $('#izcs', el).onclick = () => tombol($('#izcs', el), async () => {
    const r = await call('izinDaftar', Object.assign({}, f, { ukuran: 0 }), 60);

  }, 'Menyiapkan...');

  muat();

function izCsvSel(v) { v = String(v === null || v === undefined ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
function izUnduhCsv(rows) {
  const H = ['ID', 'Jenis', 'Nama', 'NIY/NIS', 'Kelas', 'Jenis Izin', 'Tanggal Izin', 'Jam Mulai', 'Jam Selesai/Kembali', 'Keperluan', 'Status Persetujuan', 'Status Operasional', 'Pemberi Keputusan', 'Waktu Keputusan', 'Catatan Keputusan', 'Kembali Aktual', 'Diajukan'];
  const baris = rows.map(x => [x.id, x.jenis === 'guru' ? 'Guru' : 'Siswa', x.nama, x.nip || x.nis || '', x.kelas || '', x.jenisIzin || '', x.tanggal, x.mulai, x.selesai, x.keperluan, x.setuju, x.oper, x.penyetuju, x.waktuKeputusan, x.catatan, x.kembaliAktual, x.diajukan]);
  const csv = '\uFEFF' + [H].concat(baris).map(r => r.map(izCsvSel).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'rekap-perizinan-' + hariIni() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast(`${rows.length} baris diekspor.`);
}
function izCetak(rows, hari) {
  const p = document.createElement('div'); p.id = 'cetak';
  p.innerHTML = `<h2 style="margin:0">Laporan Harian Perizinan</h2><div>SMAIT Al-Ittihad \u00B7 Tanggal ${esc(hari)} \u00B7 dicetak ${esc(new Date().toLocaleString('id-ID'))}</div>
    <table style="margin-top:10px"><tr><th>No</th><th>Jenis</th><th>Nama</th><th>Kelas/NIY</th><th>Jam</th><th>Keperluan</th><th>Status</th><th>Pemberi Keputusan</th><th>Kembali</th></tr>
    ${rows.map((x, i) => `<tr><td>${i + 1}</td><td>${x.jenis === 'guru' ? 'Guru' : 'Siswa'}</td><td>${esc(x.nama)}</td><td>${esc(x.kelas || x.nip || '')}</td><td>${esc(x.mulai)}${x.selesai ? '\u2013' + esc(x.selesai) : ''}</td><td>${esc(x.keperluan)}</td><td>${esc(x.setuju)}${x.oper && x.oper !== '-' && x.oper !== x.setuju ? ' / ' + esc(x.oper) : ''}</td><td>${esc(x.penyetuju)}</td><td>${esc(x.kembaliAktual)}</td></tr>`).join('') || '<tr><td colspan="9">Tidak ada izin pada tanggal ini.</td></tr>'}</table>`;
  document.body.appendChild(p); document.body.classList.add('mencetak');
  try { if (window.AISNative && window.AISNative.cetak) window.AISNative.cetak(); else window.print(); } catch (e) { toast('Cetak tidak tersedia di peramban ini.', 'e'); }
  setTimeout(() => { document.body.classList.remove('mencetak'); p.remove(); }, (window.AISNative ? 6000 : 600));
}

  if (staf) $('#sk', el).onchange = () => { $('#sn', el).innerHTML = '<option value="">-- pilih siswa --</option>' + S0.filter(s => s.kelas === $('#sk', el).value).sort((a, b) => a.nama.localeCompare(b.nama)).map(s => `<option value="${esc(s.nisn)}">${esc(s.nama)}</option>`).join(''); };

    if (staf && !$('#sn', el).value) throw new Error('Pilih kelas dan nama siswa.');

    const r = await call('izinAjukanSiswa', { nisn: staf ? $('#sn', el).value : '', kelas: staf ? $('#sk', el).value : '', jenisIzin: $('#sj', el).value, tanggal: $('#st', el).value, mulai: $('#sm', el).value, selesai: $('#ss', el).value, keterangan: $('#sx', el).value, mendesak: $('#sd', el).checked });
    modal(`<h3>\u2705 Pengajuan Terkirim</h3><p>Nomor pengajuan: <b>${esc(r.id)}</b></p><p>Status: <span class="bd wr">Menunggu Persetujuan</span></p>${r.tanpaWali ? '<div class="note">Kelas siswa ini belum memiliki Wali Kelas di sistem. Admin akan diberi tanda; Guru Piket dapat menyetujui sendiri; hubungi Admin untuk mengatur Wali Kelas.</div>' : '<p>Diteruskan ke Wali Kelas dan Guru Piket. Pantau di tab <b>Izin Saya</b>.</p>'}`, true);
    IZ.tab = 'saya'; halIzin($('#ct'), () => ST.halaman === 'izin');

}

function izPengaturan(el) {

const HAL = { izin: halIzin, beranda: halBeranda, catat: halCatat, absensi: halAbsensi, siswa: halSiswa, riwayat: halRiwayat, care: halCare, riwayatCare: halRiwayatCare, data: halData };
window.addEventListener('error', e => { if ($('#root') && $('#root .load') && !$('#root .auth') && !$('#app')) panelError('Terjadi kesalahan pada halaman', e.message || 'Kesalahan tidak diketahui'); });
window.addEventListener('unhandledrejection', e => { toast((e.reason && e.reason.message) || 'Terjadi kesalahan.', 'e'); });

const PWA = { prompt: null, reg: null, terpasangEvt: false, reload: false };
const iosPerangkat = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const DI_APK = /AISApp\x2f/.test(navigator.userAgent);
const modeAplikasi = () => { if (DI_APK) return true; try { return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true; } catch (e) { return false; } };
const swBisa = () => !DI_APK && !adaGAS() && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
const simpanLok = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const bacaLok = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const bacaSes = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const simpanSes = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} };

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; });
window.addEventListener('appinstalled', () => { PWA.prompt = null; PWA.terpasangEvt = true; try { toast('Aplikasi AIS berhasil dipasang.'); } catch (e) {} });

function statusPasang() {
  if (modeAplikasi() || PWA.terpasangEvt) return ['terpasang', 'Sudah diinstal (sedang dibuka sebagai aplikasi)'];
  if (!swBisa()) return ['tidak', 'Instalasi tidak didukung di sini (butuh HTTPS dan browser yang mendukung)'];
  if (PWA.prompt) return ['siap', 'Siap diinstal'];
  return ['belum', 'Belum diinstal'];
}
async function pasangSekarang() {
  if (!PWA.prompt) return toast('Browser ini tidak menyediakan tombol instal otomatis. Ikuti petunjuk di bawah.', 'e');
  try {
    PWA.prompt.prompt();
    const h = await PWA.prompt.userChoice;
    PWA.prompt = null;
    toast(h && h.outcome === 'accepted' ? 'Instalasi dimulai.' : 'Instalasi dibatalkan. Anda bisa mencoba lagi kapan saja.');
  } catch (e) { toast('Instalasi gagal: ' + (e && e.message ? e.message : 'tidak diketahui'), 'e'); }
}
function petunjukPasang() {
  const ios = iosPerangkat(), and = /Android/.test(navigator.userAgent);
  if (ios) return `<b>iPhone / iPad (Safari):</b><ol class="pl"><li>Buka halaman ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas \u2B06\uFE0F).</li><li>Pilih <b>Tambahkan ke Layar Utama</b> (Add to Home Screen), lalu <b>Tambah</b>.</li><li>Buka AIS dari ikon di layar utama.</li></ol><div class="mut">Notifikasi di iPhone/iPad hanya tersedia untuk aplikasi yang sudah ditambahkan ke Layar Utama dan iOS/iPadOS 16.4 atau lebih baru. Browser iOS lain tidak selalu menyediakan menu ini.</div>`;
  if (and) return `<b>Android (Chrome):</b><ol class="pl"><li>Ketuk tombol <b>Instal Aplikasi AIS</b> di atas bila tersedia, atau</li><li>menu <b>\u22EE</b> \u2192 <b>Instal aplikasi</b> / <b>Tambahkan ke layar utama</b>.</li></ol><div class="mut">Browser lain (Samsung Internet, Firefox, dsb.) menyediakan menu serupa di pengaturan mereka.</div>`;
  return `<b>Komputer (Chrome / Edge):</b><ol class="pl"><li>Klik tombol <b>Instal Aplikasi AIS</b> di atas, atau ikon instal \u2295 di sisi kanan kolom alamat.</li><li>Safari macOS: menu <b>File \u2192 Tambahkan ke Dock</b> (versi yang mendukung).</li></ol><div class="mut">Firefox desktop tidak mendukung instalasi PWA; AIS tetap bisa dipakai lewat browser.</div>`;
}
function statusNotif() {
  if (DI_APK) return ['tidak', 'Aplikasi Android ini belum mendukung notifikasi sistem. Lonceng \uD83D\uDD14 di dalam aplikasi tetap berfungsi.'];
  if (!('Notification' in window)) return ['tidak', 'Browser ini tidak mendukung notifikasi'];
  if (!PWA.reg) return ['tidak', swBisa() ? 'Menunggu aplikasi siap\u2026' : 'Notifikasi aplikasi butuh HTTPS (buka dari alamat GitHub Pages)'];
  if (Notification.permission === 'denied') return ['ditolak', 'Diblokir di pengaturan browser'];
  if (Notification.permission === 'granted') return [bacaLok('ais_notif') === '0' ? 'mati' : 'aktif', bacaLok('ais_notif') === '0' ? 'Izin diberikan, tetapi dimatikan di pengaturan AIS' : 'Aktif (saat AIS terbuka atau berjalan di latar belakang)'];
  return ['belum', 'Belum diaktifkan'];
}
async function aktifkanNotif() {
  if (!('Notification' in window)) return toast('Browser ini tidak mendukung notifikasi.', 'e');
  if (!PWA.reg) return toast('Aplikasi belum siap untuk notifikasi. Coba lagi sebentar.', 'e');
  if (iosPerangkat() && !modeAplikasi()) return toast('Di iPhone/iPad, tambahkan AIS ke Layar Utama dahulu, lalu aktifkan notifikasi dari aplikasi tersebut.', 'e');
  let h; try { h = await Notification.requestPermission(); } catch (e) { h = Notification.permission; }
  if (h === 'granted') { simpanLok('ais_notif', '1'); toast('Notifikasi diaktifkan.'); }
  else if (h === 'denied') toast('Izin ditolak. Anda dapat mengubahnya di pengaturan situs browser.', 'e');
  else toast('Izin belum diberikan.');
}
async function notifLokal(judul, isi, tag, url) {
  if (!PWA.reg || !('Notification' in window) || Notification.permission !== 'granted' || bacaLok('ais_notif') === '0') return false;
  try { await PWA.reg.showNotification(judul, { body: isi, tag: tag, icon: 'icons/icon-192.png', badge: 'icons/badge-96.png', data: { url: url || './' }, renotify: false }); return true; }
  catch (e) { return false; }
}
function panelPWA() {
  const sp = statusPasang(), sn = statusNotif();
  const cls = { terpasang: 'ok', siap: 'wr', belum: 'wr', tidak: 'bd', aktif: 'ok', belum_: 'wr', ditolak: 'bd', mati: 'wr' };
  const bd = (k, t) => `<span class="bd ${k === 'terpasang' || k === 'aktif' ? 'ok' : k === 'tidak' || k === 'ditolak' ? 'er' : 'wr'}">${esc(t)}</span>`;
  const m = modal(`<h3>Aplikasi & Notifikasi</h3>
    <h4 style="margin:14px 0 6px">Instal aplikasi</h4><div>${bd(sp[0], sp[1])}</div>
    <div style="margin:10px 0">${sp[0] === 'siap' ? '<button class="btn" id="pwI">\uD83D\uDCF2 Instal Aplikasi AIS</button>' : ''}</div>
    ${sp[0] === 'terpasang' ? '' : `<div class="note" style="font-size:13px">${petunjukPasang()}</div>`}
    <h4 style="margin:16px 0 6px">Notifikasi</h4><div>${bd(sn[0], sn[1])}</div>
    <p class="mut" style="font-size:13px;margin:8px 0">Notifikasi memberi tahu bila ada pengajuan izin yang menunggu keputusan Anda atau izin yang terlambat kembali. Isinya sengaja tidak memuat nama siswa/guru. <b>Pemberitahuan saat aplikasi benar-benar tertutup (push) belum aktif</b> karena butuh server pengirim khusus.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${sn[0] === 'belum' ? '<button class="btn" id="pwN">\uD83D\uDD14 Aktifkan Notifikasi</button>' : ''}${sn[0] === 'aktif' ? '<button class="btn o" id="pwT">Kirim notifikasi uji</button><button class="btn o" id="pwM">Matikan</button>' : ''}${sn[0] === 'mati' ? '<button class="btn" id="pwH">Hidupkan</button>' : ''}</div>
    ${sn[0] === 'ditolak' ? '<div class="note" style="font-size:13px">Izin notifikasi sebelumnya ditolak. Buka pengaturan situs di browser (ikon gembok di kolom alamat \u2192 Notifikasi \u2192 Izinkan), lalu muat ulang.</div>' : ''}
    <div class="mut" style="margin-top:14px;font-size:12px">Versi ${esc(VERSI)}</div>`);
  const ulang = () => { m.tutup(); panelPWA(); };
  const b = id => document.getElementById(id);
  if (b('pwI')) b('pwI').onclick = async () => { await pasangSekarang(); ulang(); };
  if (b('pwN')) b('pwN').onclick = async () => { await aktifkanNotif(); ulang(); };
  if (b('pwT')) b('pwT').onclick = async () => { const ok = await notifLokal('AIS \u2014 Uji Notifikasi', 'Notifikasi AIS berfungsi di perangkat ini.', 'ais-uji', './'); toast(ok ? 'Notifikasi uji dikirim.' : 'Gagal menampilkan notifikasi.', ok ? 's' : 'e'); };
  if (b('pwM')) b('pwM').onclick = () => { simpanLok('ais_notif', '0'); ulang(); };
  if (b('pwH')) b('pwH').onclick = () => { simpanLok('ais_notif', '1'); ulang(); };
}

function bannerUpdate(sw) {
  if ($('#updbar')) return;
  const d = document.createElement('div'); d.id = 'updbar'; d.setAttribute('role', 'status');
  d.innerHTML = '<span>Versi baru AIS tersedia.</span><button id="updgo">Perbarui Sekarang</button><button id="updnt" aria-label="Nanti">Nanti</button>';
  document.body.appendChild(d);
  $('#updnt').onclick = () => d.remove();
  $('#updgo').onclick = () => {
    const isi = Array.from(document.querySelectorAll('#ct input:not([type=checkbox]):not([type=radio]):not([readonly]), #ct textarea')).some(x => String(x.value || '').trim());
    if (isi && !confirm('Ada isian yang belum disimpan dan akan hilang saat memperbarui. Tetap perbarui sekarang?')) return;
    PWA.reload = true; sw.postMessage({ type: 'SKIP_WAITING' });
    setTimeout(() => { if (PWA.reload) location.reload(); }, 3000);
  };
}
async function daftarSW() {
  if (!swBisa()) return;
  try {
    const reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
    PWA.reg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) bannerUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const n = reg.installing; if (!n) return;
      n.addEventListener('statechange', () => { if (n.state === 'installed' && navigator.serviceWorker.controller) bannerUpdate(n); });
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (PWA.reload) location.reload(); });
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'BUKA') bukaDariUrl(e.data.url); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  } catch (e) {  }
}
function bukaDariUrl(u) {
  try { const id = new URL(u, location.href).searchParams.get('buka'); if (id && ST.user) buka(id); } catch (e) {}
}

function tandaiKoneksi() {
  let b = $('#offbar');
  if (navigator.onLine === false) {
    if (!b) { b = document.createElement('div'); b.id = 'offbar'; b.setAttribute('role', 'alert'); document.body.appendChild(b); }
    b.innerHTML = 'Anda sedang offline. Data mungkin belum diperbarui dan perubahan tidak dapat disimpan. <button id="offcb">Coba lagi</button>';
    $('#offcb').onclick = () => { if (navigator.onLine === false) toast('Masih offline.', 'e'); else { tandaiKoneksi(); if (ST.user) buka(ST.halaman); } };
  } else if (b) { b.remove(); toast('Koneksi pulih.'); }
}
window.addEventListener('offline', tandaiKoneksi); window.addEventListener('online', tandaiKoneksi);

function daftarNotif() {
  const n = ST.notif || { perlu: 0, telat: 0 }, a = [];
  if (n.perlu > 0) a.push({ ikon: '\uD83D\uDEAA', teks: `${n.perlu} pengajuan izin menunggu keputusan Anda`, tujuan: 'izin', tab: 'setuju' });
  if (n.telat > 0) a.push({ ikon: '\u23F0', teks: `${n.telat} izin terlambat kembali`, tujuan: 'izin', tab: 'dash' });
  return a;
}
const sigNotif = () => { const n = ST.notif || {}; return (n.perlu || 0) + ':' + (n.telat || 0); };
function gambarLonceng() {
  const b = $('#bel'); if (!b) return;
  const total = daftarNotif().length ? (ST.notif.perlu + ST.notif.telat) : 0, baru = total > 0 && bacaSes('ais_dilihat') !== sigNotif();
  const o = $('.nb', b); if (o) o.remove();
  if (baru) b.insertAdjacentHTML('beforeend', `<b class="nb" aria-label="${total} notifikasi belum dibaca">${total}</b>`);
}
function panelNotif() {
  const a = daftarNotif(); simpanSes('ais_dilihat', sigNotif());
  const m = modal(`<h3>Notifikasi</h3>${a.length ? a.map((x, i) => `<div class="izr" tabindex="0" role="button" data-n="${i}"><div>${x.ikon} ${esc(x.teks)}</div><div class="izw">Buka \u203A</div></div>`).join('') : '<div class="mut" style="padding:14px 0">Tidak ada notifikasi baru.</div>'}
    <div class="mut" style="font-size:12px;margin:8px 0">Notifikasi hanya menampilkan data yang menjadi hak akses Anda.</div><button class="btn o s" id="nPeng">\u2699\uFE0F Aplikasi & pengaturan notifikasi</button>`);
  $$('[data-n]', m).forEach(el => { const go = () => { const x = a[+el.dataset.n]; m.tutup(); if (typeof IZ !== 'undefined') IZ.tab = x.tab; buka(x.tujuan); }; el.onclick = go; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }; });
  $('#nPeng', m).onclick = () => { m.tutup(); panelPWA(); };
  gambarLonceng();
}
async function perbaruiNotif(n) {
  const sebelum = parseInt(bacaSes('ais_nc') || '0', 10), total = n.perlu + n.telat;
  ST.notif = n; gambarLonceng();
  if (total > sebelum && total > 0) {
    const t = n.perlu > 0 ? `${n.perlu} pengajuan izin menunggu keputusan Anda.` : `${n.telat} izin terlambat kembali.`;
    notifLokal('AIS \u2014 Perizinan', t, 'ais-izin', './?buka=izin');
  }
  simpanSes('ais_nc', String(total));
}
function hentikanNotif() {
  if (ST.notifT) { clearInterval(ST.notifT); ST.notifT = null; }
  simpanSes('ais_nc', null); simpanSes('ais_dilihat', null); ST.notif = null;
  try { if (PWA.reg) { PWA.reg.getNotifications().then(a => a.forEach(x => x.close())); if (PWA.reg.pushManager) PWA.reg.pushManager.getSubscription().then(s => s && s.unsubscribe()).catch(() => {}); } } catch (e) {}
}

(function () {
  const s = document.getElementById('splash'); if (!s) return;
  const mulai = Date.now();
  const tutup = () => { s.classList.add('hilang'); setTimeout(() => s.remove(), 450); };
  const t = setInterval(() => {
    if (window.__AIS.siap) { clearInterval(t); setTimeout(tutup, Math.max(0, 700 - (Date.now() - mulai))); }
    else if (Date.now() - mulai > 9000) {
      clearInterval(t);
      const p = s.querySelector('.sp-st'); p.innerHTML = 'Memuat lebih lama dari biasanya.<br><button id="spUlang">Coba lagi</button> <button id="spRinci">Lihat rincian</button>';
      document.getElementById('spUlang').onclick = () => location.reload();
      document.getElementById('spRinci').onclick = tutup;
    }
  }, 100);
})();

(function () {
  let n = 0;
  const rapikan = () => document.querySelectorAll('label:not([for])').forEach(l => {
    if (l.querySelector('input,select,textarea')) return;
    let e = l.nextElementSibling;
    while (e && !/^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) && !(e.querySelector && e.querySelector('input,select,textarea'))) { if (e.tagName === 'LABEL') return; e = e.nextElementSibling; }
    if (!e) return;
    const f = /^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) ? e : e.querySelector('input,select,textarea');
    if (!f) return; if (!f.id) f.id = 'f_' + (++n); l.setAttribute('for', f.id);
  });
  let t = null; new MutationObserver(() => { clearTimeout(t); t = setTimeout(rapikan, 50); }).observe(document.body, { childList: true, subtree: true });
})();
try { document.getElementById('spLogo').innerHTML = LOGO_IKON; } catch (e) {}
daftarSW(); tandaiKoneksi();

(async function boot() {
  const t = bacaToken();
  if (!t) return layarLogin('staf');
  ST.token = t;
  try { const r = await call('sesi', {}, 12); ST.user = r.user; mulaiApp(); }
  catch (e) { ST.token = null; simpanToken(''); layarLogin('staf', /berakhir|SESI/i.test(e.message) ? 'Silakan login.' : e.message); }
})();
</script>
