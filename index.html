      .then(r => { if (!r.ok) throw new Error('Server menjawab ' + r.status + '. Pastikan deployment Web App "Siapa yang memiliki akses: Siapa saja".'); return r.text(); })
      .then(raw => proses(raw, ok, gagal))
      .catch(e => gagal(new Error(/Failed to fetch|NetworkError|Load failed/i.test(String(e && e.message)) ? 'Tidak dapat menghubungi server. Periksa koneksi internet dan deployment Web App.' : e.message)));
  });
}
function simpanToken(t) { try { sessionStorage.setItem('ais_t', t || ''); } catch (e) {} }
function bacaToken() { try { return sessionStorage.getItem('ais_t') || ''; } catch (e) { return ''; } }
function loading(el) { el.innerHTML = '<div class="load"><div class="sp"></div> Memuat...</div>'; }
function modal(html, kecil) {
  const m = document.createElement('div'); m.className = 'mbg';
  m.innerHTML = `<div class="modal ${kecil ? 'sm' : ''}"><button class="x" aria-label="Tutup">&times;</button>${html}</div>`;
  const tutup = () => m.remove();
  m.addEventListener('mousedown', e => { if (e.target === m) tutup(); });
  $('.x', m).onclick = tutup;
  document.body.appendChild(m);
  m.tutup = tutup; return m;
}
async function tombol(btn, fn, label) {

// ---------- lampiran bukti ----------
const fmtUkuran = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
async function siapkanBerkas(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (/^image\//.test(f.type) || ['jpg', 'jpeg', 'png', 'webp', 'gif'].indexOf(ext) >= 0) {
    let bmp;
    try { bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); }
    catch (e) { try { bmp = await createImageBitmap(f); } catch (e2) { throw new Error('Format foto "' + f.name + '" tidak didukung. Gunakan JPG atau PNG.'); } }
    const sk = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * sk)); c.height = Math.max(1, Math.round(bmp.height * sk));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.82);   // render ulang = metadata EXIF (lokasi, tipe HP) hilang
    const data = url.split(',')[1];
    return { ext: 'jpg', data: data, ukuran: Math.floor(data.length * 0.75), thumb: url, label: f.name };
  }
  if (['pdf', 'docx', 'xlsx', 'txt'].indexOf(ext) < 0) throw new Error('Jenis file "' + f.name + '" tidak didukung (boleh: foto, PDF, DOCX, XLSX, TXT).');
  if (f.size > 4 * 1024 * 1024) throw new Error('"' + f.name + '" lebih dari 4 MB.');
  const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => no(new Error('Gagal membaca file.')); r.readAsDataURL(f); });
  return { ext: ext, data: data, ukuran: f.size, thumb: '', label: f.name };
}
/** Sel tabel "Bukti": tombol Lihat Berkas bila ada lampiran. */
const selBukti = x => x.lampiran && x.lampiran.length ? `<button class="btn o s" data-b="${esc(x.id)}">📎 Lihat Berkas (${x.lampiran.length})</button>` : '<span class="mut">-</span>';
/** Pasang aksi tombol "Lihat Berkas" pada tabel: membuka jendela daftar bukti laporan. */
function pasangBukti(wadah, daftar) {
  $$('[data-b]', wadah).forEach(b => b.onclick = () => {

/** Daftar lampiran pada laporan (untuk pengelola): Lihat Berkas (tampil/unduh di dalam AIS) dan Buka di Drive (tab baru). */
function tampilLampiran(m, x) {
  const el = $('#lmp', m); if (!el) return;
  if (!x.lampiran || !x.lampiran.length) { el.innerHTML = '<div class="mut">Tidak ada lampiran bukti.</div>'; return; }

  $$('[data-l]', el).forEach(b => b.onclick = () => tombol(b, async () => {

      $('#lmv', el).innerHTML = /^image\//.test(r.tipe) ? `<img src="${src}" alt="Bukti" style="max-width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--line)"><div style="margin-top:8px"><a class="btn s" href="${src}" download="${esc(r.nama)}">⬇ Unduh foto</a></div>` : `<a class="btn s" href="${src}" download="${esc(r.nama)}" style="margin-top:8px">⬇ Unduh ${esc(r.nama)}</a>`;
    } catch (e) { $('#lmv', el).innerHTML = ''; throw e; }

}


// ---------- RIWAYAT CARE AND REPORT (khusus BK) ----------
function halRiwayatCare(ct, hidup) {
  ct.innerHTML = `<div class="note">🔒 Halaman ini <b>hanya dapat dibuka oleh Guru BK</b>. Berisi seluruh arsip laporan, termasuk yang sudah Selesai/Ditutup. Untuk mengubah status laporan aktif, gunakan menu Al-Ittihad Care and Report.</div>
   <div id="rcs"></div>
   <div class="card"><div class="row"><div><label>Status</label><select id="rs1"><option value="">Semua</option>${STL.map(s => `<option>${s}</option>`).join('')}</select></div>
   <div><label>Kategori</label><select id="rk1"><option value="">Semua</option>${KAT.map(k => `<option>${esc(k)}</option>`).join('')}</select></div>
   <div><label>Dari</label><input id="rd1" type="date"></div><div><label>Sampai</label><input id="re1" type="date"></div>
   <div style="flex:2"><label>Cari kata / kode</label><input id="rc1" placeholder="Kode, isi laporan, lokasi..."></div></div></div><div id="rcl"></div>`;
  let timer; const muat = async () => {
    const rid = ST.rid; loading($('#rcl'));
    try {
      const r = await call('laporRiwayat', { status: $('#rs1').value, kategori: $('#rk1').value, dari: $('#rd1').value, sampai: $('#re1').value, cari: $('#rc1').value });
      if (rid !== ST.rid) return;
      $('#rcs').innerHTML = `<div class="grid g4" style="margin-bottom:16px">${[['Total laporan', r.semua, ''], ['Baru', r.hitung.Baru || 0, 'w'], ['Diproses', r.hitung.Diproses || 0, ''], ['Selesai / Ditutup', (r.hitung.Selesai || 0) + (r.hitung.Ditutup || 0), '']].map(x => `<div class="card stat ${x[2]}" style="margin:0"><div class="n">${x[1]}</div><div class="l">${x[0]}</div></div>`).join('')}</div>`;
      $('#rcl').innerHTML = `<div class="card"><div class="mut" style="margin-bottom:8px">${r.total} laporan ditampilkan${r.total > 500 ? ' (500 terbaru)' : ''}</div><div class="tw"><table><tr><th>Waktu</th><th>Kode</th><th>Kategori</th><th>Ringkasan</th><th>Pelapor</th><th>Bukti</th><th>Status</th><th></th></tr>
        ${r.data.map(x => `<tr><td style="white-space:nowrap">${esc(x.waktu)}</td><td><b>${esc(x.kode)}</b>${x.lampiran && x.lampiran.length ? ' 📎' : ''}</td><td>${esc(x.kategori)}</td><td style="max-width:280px">${esc(x.deskripsi.length > 90 ? x.deskripsi.slice(0, 90) + '…' : x.deskripsi)}</td><td>${x.anonim ? '<span class="bd">Anonim</span>' : esc(x.pelaporNama) + `<div class="mut">${esc(x.pelaporRole)} ${esc(x.pelaporKelas)}</div>`}</td><td>${selBukti(x)}</td><td>${bdStatus(x.status)}</td><td><button class="btn o s" data-i="${esc(x.id)}">Lihat</button></td></tr>`).join('') || '<tr><td colspan="7" class="empty">Tidak ada laporan</td></tr>'}</table></div></div>`;
      pasangBukti($('#rcl'), r.data);
      $$('[data-i]', $('#rcl')).forEach(b => b.onclick = () => {
        const x = r.data.find(y => y.id === b.dataset.i);
        const mr = modal(`<h3>${esc(x.kode)} ${bdStatus(x.status)}</h3><div class="mut">${esc(x.kategori)} · ${esc(x.waktu)}${x.lokasi ? ' · ' + esc(x.lokasi) : ''}</div>
          <div class="note" style="white-space:pre-wrap;margin-top:10px">${esc(x.deskripsi)}</div>
          <div class="mut">Pelapor: ${x.anonim ? '<b>Anonim</b> (identitas tidak disimpan)' : esc(x.pelaporNama) + ' · ' + esc(x.pelaporRole) + ' ' + esc(x.pelaporKelas) + (x.kontak ? ' · ' + esc(x.kontak) : '')}</div>
          <div id="lmp" style="margin-top:8px"></div>
          ${x.catatan ? `<div class="note good" style="margin-top:10px"><b>Catatan penanganan:</b> ${esc(x.catatan)}</div>` : '<div class="mut" style="margin-top:10px">Belum ada catatan penanganan.</div>'}
          ${x.ditanganiOleh ? `<div class="mut">Ditangani: ${esc(x.ditanganiOleh)} · ${esc(x.tanggalDitangani)}</div>` : ''}`);
        tampilLampiran(mr, x);
      });
    } catch (e) { if (rid === ST.rid) $('#rcl').innerHTML = `<div class="note">${esc(e.message)}</div>`; }
  };
  ['rs1', 'rk1', 'rd1', 're1'].forEach(i => { $('#' + i).onchange = muat; });
  $('#rc1').oninput = () => { clearTimeout(timer); timer = setTimeout(muat, 350); };
  muat();
}

// ---------- DATA & PENGATURAN (Admin/BK) ----------
function halData(ct) {
  ct.innerHTML = `<div class="seg" style="margin-bottom:14px"><button data-t="s" class="on">Siswa</button><button data-t="u">Pengguna</button><button data-t="p">Pengaturan</button></div><div id="db"></div>`;
  const tab = t => { $$('.seg button', ct).forEach(b => b.classList.toggle('on', b.dataset.t === t)); ({ s: dataSiswa, u: dataUser, p: dataSet })[t]($('#db')); };
  $$('.seg button', ct).forEach(b => b.onclick = () => tab(b.dataset.t)); tab('s');
}
async function dataSiswa(el) {
  loading(el);
  const muatUlang = async () => { ST.awal = await call('awal'); dataSiswa(el); };
  const daf = await call('siswaAdmin');
  const tanpaTgl = daf.filter(s => !s.tanggalLahir && s.status === 'Aktif').length;
  el.innerHTML = `<div class="card"><div class="row"><div style="flex:3"><b>${daf.length} siswa</b>${tanpaTgl ? ` <span class="bd wr">${tanpaTgl} belum ada tanggal lahir (tidak bisa login)</span>` : ''}</div>
    <button class="btn" id="sn" style="flex:0;white-space:nowrap">+ Tambah</button><button class="btn o" id="si" style="flex:0;white-space:nowrap">Impor Massal</button></div>
    <div class="row" style="margin-top:8px"><div><input id="dc" placeholder="Cari nama / NISN / kelas..."></div></div>
    <div class="tw" style="max-height:480px;overflow:auto;margin-top:8px"><table id="dt"></table></div></div>`;
  const tabel = () => {
    const q = $('#dc').value.toLowerCase();
    $('#dt').innerHTML = '<tr><th>NISN</th><th>Nama</th><th>Kelas</th><th>Tgl Lahir</th><th>Status</th><th></th></tr>' + daf.filter(s => !q || (s.nama + s.nisn + s.kelas).toLowerCase().includes(q)).slice(0, 300).map(s =>
      `<tr><td>${esc(s.nisn)}</td><td>${esc(s.nama)}</td><td>${esc(s.kelas)}</td><td>${s.tanggalLahir ? esc(s.tanggalLahir) : '<span class="bd wr">kosong</span>'}</td><td>${esc(s.status)}</td><td><button class="btn o s" data-n="${esc(s.nisn)}">Ubah</button></td></tr>`).join('');
    $$('[data-n]', $('#dt')).forEach(b => b.onclick = () => formSiswa(daf.find(x => x.nisn === b.dataset.n), muatUlang));
  };
  $('#dc').oninput = tabel; tabel();
  $('#sn').onclick = () => formSiswa(null, muatUlang);
  $('#si').onclick = () => {
    const m = modal(`<h3>Impor Massal Siswa</h3><div class="note">Tempel dari Excel/Sheets, satu siswa per baris, kolom: <b>NISN, Nama, Kelas, Tanggal Lahir</b> (dipisah tab/koma/titik-koma). Tanggal lahir boleh <i>2008-05-17</i> atau <i>17/05/2008</i>. NISN yang sudah ada akan diperbarui.</div><textarea id="im" style="min-height:200px" placeholder="1234567890	Ahmad Fulan	X 1	17/05/2008"></textarea><div style="margin-top:12px"><button class="btn" id="iv">Impor</button></div>`);
    $('#iv', m).onclick = () => tombol($('#iv', m), async () => {
      const r = await call('siswaImpor', { teks: $('#im', m).value }); m.tutup();
      toast(`Impor: ${r.baru} baru, ${r.diubah} diperbarui${r.gagal.length ? ', ' + r.gagal.length + ' gagal' : ''}.`, r.gagal.length ? 'e' : 's');
      if (r.gagal.length) modal(`<h3>Baris gagal</h3><ul>${r.gagal.map(g => `<li>${esc(g)}</li>`).join('')}</ul>`, true);
      muatUlang();
    }, 'Mengimpor...');
  };
}
function formSiswa(s, selesai) {
  const m = modal(`<h3>${s ? 'Ubah' : 'Tambah'} Siswa</h3><label>NISN</label><input id="fn" value="${esc(s ? s.nisn : '')}"><label>Nama</label><input id="fm" value="${esc(s ? s.nama : '')}">
    <div class="row"><div><label>Kelas</label><input id="fk2" list="dl" value="${esc(s ? s.kelas : '')}"><datalist id="dl">${ST.awal.kelas.map(k => `<option>${esc(k)}</option>`).join('')}</datalist></div>
    <div><label>Tanggal lahir (untuk login siswa)</label><input id="ft2" type="date" value="${esc(s ? s.tanggalLahir : '')}"></div></div>
    <label>Status</label><select id="fs"><option ${s && s.status === 'Aktif' || !s ? 'selected' : ''}>Aktif</option><option ${s && s.status === 'Nonaktif' ? 'selected' : ''}>Nonaktif</option></select>
    <div style="margin-top:12px"><button class="btn" id="fv">Simpan</button></div>`, true);
  $('#fv', m).onclick = () => tombol($('#fv', m), async () => {
    await call('siswaSimpan', { nisnLama: s ? s.nisn : '', nisn: $('#fn', m).value, nama: $('#fm', m).value, kelas: $('#fk2', m).value, tanggalLahir: $('#ft2', m).value, status: $('#fs', m).value });
    m.tutup(); toast('Data siswa tersimpan.'); selesai();
  });
}
async function dataUser(el) {
  loading(el); const daf = await call('userList');
  el.innerHTML = `<div class="card"><div class="tw"><table><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>${daf.map(u => `<tr><td>${esc(u.nama)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td><span class="bd ${u.status === 'Aktif' ? 'ok' : 'wr'}">${esc(u.status)}</span></td><td><button class="btn o s" data-e="${esc(u.email)}">Ubah</button></td></tr>`).join('')}</table></div></div>`;
  $$('[data-e]', el).forEach(b => b.onclick = () => {
    const u = daf.find(x => x.email === b.dataset.e);
    const m = modal(`<h3>${esc(u.nama)}</h3><div class="mut">${esc(u.email)}</div><label>Role</label><select id="ur">${['Guru','Piket','WaliKelas','BK','Wakasis','Kepsek','Admin'].map(r => `<option ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}</select>
      <label>Status</label><select id="uu">${['Aktif','Nonaktif','Menunggu Persetujuan'].map(r => `<option ${r === u.status ? 'selected' : ''}>${r}</option>`).join('')}</select><div style="margin-top:12px"><button class="btn" id="uv">Simpan</button></div>`, true);
    $('#uv', m).onclick = () => tombol($('#uv', m), async () => { await call('userSimpan', { email: u.email, role: $('#ur', m).value, status: $('#uu', m).value }); m.tutup(); toast('Pengguna diperbarui.'); dataUser(el); });
  });
}
function dataSet(el) {
  const a = ST.awal;
  el.innerHTML = `<div class="card" style="max-width:460px"><h3>Tahun Ajaran & Semester Aktif</h3><div class="note">Ubah saat pergantian semester. Tingkat eskalasi SHB dihitung per semester.</div>
    <label>Tahun ajaran</label><input id="pt" value="${esc(a.tahunAjaran)}" placeholder="2026/2027"><label>Semester</label><select id="pm"><option ${a.semesterAktif === 'Ganjil' ? 'selected' : ''}>Ganjil</option><option ${a.semesterAktif === 'Genap' ? 'selected' : ''}>Genap</option></select>
    <div style="margin-top:12px"><button class="btn" id="pv">Simpan</button></div>
    <hr style="border:0;border-top:1px solid #e5e7eb;margin:18px 0"><h3>Impor Data Versi Lama</h3><div class="note">Menyalin riwayat pelanggaran, prestasi, kehadiran, dan laporan Care dari sheet versi lama (LogPelanggaran, LogPrestasi, Absensi, AbsensiShalat, LaporanCare) ke AIS. Aman diklik berulang — data yang sudah disalin dilewati. Sheet lama tidak diubah.</div>
    <button class="btn o" id="mg">Impor Data Lama</button>
    <p class="mut" style="margin-top:16px">Daftar pelanggaran/prestasi & poinnya ada di sheet <b>Aturan</b> pada Google Sheet — ubah langsung di sana lalu muat ulang halaman.</p></div>`;
  $('#mg').onclick = () => tombol($('#mg'), async () => {
    const r = await call('migrasi');
    ST.awal = await call('awal');
    modal(`<h3>Impor selesai</h3><ul><li><b>${r.pelanggaran}</b> pelanggaran</li><li><b>${r.prestasi}</b> prestasi</li><li><b>${r.kehadiran}</b> data kehadiran</li><li><b>${r.laporan}</b> laporan Care</li></ul><p class="mut">Angka 0 berarti semua data sudah pernah disalin.</p>`, true);
  }, 'Mengimpor...');
  $('#pv').onclick = () => tombol($('#pv'), async () => { await call('setSimpan', { tahunAjaran: $('#pt').value, semester: $('#pm').value }); ST.awal = await call('awal'); $('#sb').textContent = `${ST.awal.tahunAjaran} · Semester ${ST.awal.semesterAktif}`; toast('Pengaturan tersimpan.'); });
}

// ---------- start ----------
function panelError(judul, detail) {
  const r = $('#root'); if (!r) return;
  window.__AIS.siap = true;
  r.innerHTML = `<div class="auth"><div class="box"><div class="lg">${LOGO}</div><h3>${esc(judul)}</h3><div class="note">${esc(detail)}</div>
    <div class="mut" style="font-size:12px;margin-bottom:12px">Versi tampilan: ${esc(VERSI)}</div>
    <button class="btn" id="re1" style="width:100%;justify-content:center">Muat ulang</button>
    <button class="btn o" id="re2" style="width:100%;justify-content:center;margin-top:8px">Hapus sesi & ke halaman login</button></div></div>`;
  $('#re1').onclick = () => location.reload();
  $('#re2').onclick = () => { simpanToken(''); ST.token = null; layarLogin('staf'); };
}
const HAL = { beranda: halBeranda, catat: halCatat, absensi: halAbsensi, siswa: halSiswa, riwayat: halRiwayat, care: halCare, riwayatCare: halRiwayatCare, data: halData };
window.addEventListener('error', e => { if ($('#root') && $('#root .load') && !$('#root .auth') && !$('#app')) panelError('Terjadi kesalahan pada halaman', e.message || 'Kesalahan tidak diketahui'); });
window.addEventListener('unhandledrejection', e => { toast((e.reason && e.reason.message) || 'Terjadi kesalahan.', 'e'); });
(async function boot() {
  const t = bacaToken();
  if (!t) return layarLogin('staf');
  ST.token = t;
  try { const r = await call('sesi', {}, 12); ST.user = r.user; mulaiApp(); }
  catch (e) { ST.token = null; simpanToken(''); layarLogin('staf', /berakhir|SESI/i.test(e.message) ? 'Silakan login.' : e.message); }
})();
</script>
